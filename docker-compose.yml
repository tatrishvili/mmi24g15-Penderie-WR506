# ============================================================================
#  docker-compose.yml — Penderie development environment
# ----------------------------------------------------------------------------
#  Services
#    db        MariaDB 11 (storage: named volume "db_data")
#    api       PHP 8.4-FPM + Composer (build: docker/api/Dockerfile)
#    nginx     Serves the Symfony public/ dir on http://localhost:8000
#    frontend  Vite dev server on http://localhost:5173 (proxies /api -> nginx)
#
#  Typical usage
#    docker compose up -d --build
#    docker compose run --rm --no-deps api composer create-project ...
#    docker compose exec api composer <command>
# ============================================================================

name: penderie

services:
  db:
    image: mariadb:11
    container_name: penderie-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-penderie}
      MARIADB_USER: ${DB_USER:-penderie}
      MARIADB_PASSWORD: ${DB_PASSWORD:-penderie}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-penderie-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: penderie-api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      COMPOSER_MEMORY_LIMIT: -1
      MAILER_DSN: ${MAILER_DSN:-smtp://mailpit:1025}
      MAILER_FROM_ADDRESS: ${MAILER_FROM_ADDRESS:-no-reply@penderie.local}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: penderie-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    image: penderie-frontend:dev
    container_name: penderie-frontend
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /app
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      API_PROXY_TARGET: http://nginx
    command: >
      sh -c "[ -d node_modules ] || npm install --no-audit --no-fund;
             npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      nginx:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    container_name: penderie-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

  # ---- End-to-end tests (course section: Cypress) --------------------------
  # Headless runner: `make test-e2e` (or `npm run test:e2e`).
  # The image entrypoint is `cypress run`; the profile keeps it out of
  # `docker compose up -d` (it would run the suite once and exit).
  cypress:
    image: cypress/included:16.2.0
    profiles: ["e2e"]
    working_dir: /e2e
    environment:
      CYPRESS_baseUrl: http://frontend:5173
    volumes:
      - ./cypress.config.js:/e2e/cypress.config.js:ro
      - ./cypress:/e2e/cypress
    depends_on:
      - frontend
      - api
      - mailpit

volumes:
  db_data:
