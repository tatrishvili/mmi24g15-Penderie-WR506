name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
      - "pre-production/**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Symfony)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, iconv, intl, mbstring, pdo_mysql, zip, gd
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Warm the Symfony test container (PHPStan reads it)
        run: php bin/console cache:warmup --env=test --no-interaction

      - name: Symfony linters (container + YAML)
        run: |
          php bin/console lint:container --env=test
          php bin/console lint:yaml config

      - name: Coding standard (PHP-CS-Fixer)
        run: composer cs:check

      - name: Static analysis (PHPStan level 6)
        run: composer stan

      - name: Unit tests (PHPUnit)
        run: composer test

      - name: Dependency audit (Composer)
        run: composer audit --no-interaction

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type check (TypeScript)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  lighthouse:
    name: Lighthouse (performance / a11y)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Collect Lighthouse metrics
        run: npx lhci collect

      - name: Assert budgets (performance, accessibility, best practices, SEO)
        run: npx lhci assert

      - name: Write the HTML reports
        if: always()
        run: npx lhci upload

      - name: Upload the reports as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: frontend/lighthouse-report
          retention-days: 14
