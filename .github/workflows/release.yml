# ----------------------------------------------------------------------------
#  Release — publish the Docker images to GitHub Container Registry.
#
#  Git Flow:  feature/* → develop → release/* → main
#  Tag `main` to cut a release:        git tag v1.0.0 && git push origin v1.0.0
#  The tag is what selects the image tag (v1.0.0, plus `latest`).
#
#  Images are only pushed from a tag; CI (ci.yml) must be green first.
# ----------------------------------------------------------------------------

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Docker images to ghcr.io
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lowercase the image name (Packages rejects uppercase)
        id: image
        run: echo "repository=$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}/api:${{ github.ref_name }}
            ghcr.io/${{ steps.image.outputs.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}/frontend:${{ github.ref_name }}
            ghcr.io/${{ steps.image.outputs.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
