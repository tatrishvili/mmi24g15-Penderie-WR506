# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/best_practices.html#use-parameters-for-application-configuration
parameters:
    openrouter_api_key: '%env(default::OPENROUTER_API_KEY)%'
    openrouter_model_default: 'google/gemma-4-31b-it:free'
    openrouter_model: '%env(default:openrouter_model_default:OPENROUTER_MODEL)%'
    frontend_app_url_default: 'http://localhost:5173'
    mailer_from_address_default: 'no-reply@penderie.local'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # OpenRouter client for AI image analysis
    App\Service\Scan\OpenRouterClient:
        arguments:
            $apiKey: '%openrouter_api_key%'
            $model: '%openrouter_model%'

    # Item photos land on disk under var/uploads (git-ignored), never in the DB.
    App\Service\ItemService:
        arguments:
            $uploadDir: '%kernel.project_dir%/var/uploads'

    App\Service\AuthService:
        arguments:
            $frontendBaseUrl: '%env(default:frontend_app_url_default:PUBLIC_APP_URL)%'
            $mailerFromAddress: '%env(default:mailer_from_address_default:MAILER_FROM_ADDRESS)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
